name: Linting CI
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # 1. Lint JavaScript (using your ESLint v10)
      - name: Lint JavaScript
        run: npm run lint

      # 2. Lint HTML
      - name: Lint HTML
        run: npx htmlhint "**/*.html"

      # 3. Lint CSS
      - name: Lint CSS
        run: npx stylelint "**/*.css"