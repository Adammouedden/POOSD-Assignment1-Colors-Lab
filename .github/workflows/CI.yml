name: JavaScript Linting
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22  # Matches v22.17.1
          cache: 'npm'

      - name: Install dependencies
        # npm ci is highly recommended for CI/CD
        run: npm ci

      - name: Run ESLint
        run: npm run lint